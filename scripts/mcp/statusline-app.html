<!doctype html>
<!-- app-version: 1.12.0 -->

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statusline</title>
  <style>
:root {
  color-scheme: light dark;
  --bg-1: var(--color-background-primary, #ffffff);
  --bg-2: var(--color-background-secondary, #f5f7fa);
  --bg-3: var(--color-background-tertiary, #ebeef4);
  --fg-1: var(--color-text-primary, #1b222c);
  --fg-2: var(--color-text-secondary, #536072);
  --fg-3: var(--color-text-tertiary, #7a869a);
  --bd-1: var(--color-border-primary, #d5dce6);
  --bd-2: var(--color-border-secondary, #e6ebf2);
  --accent: #1a73e8;
  --accent-soft: rgba(26, 115, 232, 0.14);
  --tier-blue: #57caff;
  --tier-green: #5cdb6d;
  --tier-yellow: #ffd427;
  --tier-red: #ff7daf;
  --tier-blue-fg: #0369a1;
  --tier-green-fg: #15803d;
  --tier-yellow-fg: #a16207;
  --tier-red-fg: #be185d;
  --font-main: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
  font-family: var(--font-main);
  font-size: 13px;
}

:root[data-theme="dark"] {
  --bg-1: var(--color-background-primary, #15181e);
  --bg-2: var(--color-background-secondary, #1d222b);
  --bg-3: var(--color-background-tertiary, #262c38);
  --fg-1: var(--color-text-primary, #e8edf5);
  --fg-2: var(--color-text-secondary, #a8b3c7);
  --fg-3: var(--color-text-tertiary, #7d899e);
  --bd-1: var(--color-border-primary, #343d4e);
  --bd-2: var(--color-border-secondary, #29303e);
  --accent: #6ea8fe;
  --accent-soft: rgba(110, 168, 254, 0.16);
  --tier-blue-fg: #57caff;
  --tier-green-fg: #5cdb6d;
  --tier-yellow-fg: #ffd427;
  --tier-red-fg: #ff7daf;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-1: var(--color-background-primary, #15181e);
    --bg-2: var(--color-background-secondary, #1d222b);
    --bg-3: var(--color-background-tertiary, #262c38);
    --fg-1: var(--color-text-primary, #e8edf5);
    --fg-2: var(--color-text-secondary, #a8b3c7);
    --fg-3: var(--color-text-tertiary, #7d899e);
    --bd-1: var(--color-border-primary, #343d4e);
    --bd-2: var(--color-border-secondary, #29303e);
    --accent: #6ea8fe;
    --accent-soft: rgba(110, 168, 254, 0.16);
    --tier-blue-fg: #57caff;
    --tier-green-fg: #5cdb6d;
    --tier-yellow-fg: #ffd427;
    --tier-red-fg: #ff7daf;
  }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg-1);
  color: var(--fg-1);
  line-height: 1.45;
}

.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding: 10px 12px 24px;
  gap: 10px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg-1);
  border-bottom: 1px solid var(--bd-2);
  padding-bottom: 8px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.topbar-group {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.btn, .select-ctrl, .input-ctrl {
  font: inherit;
  font-size: 12px;
  color: var(--fg-1);
  background: var(--bg-2);
  border: 1px solid var(--bd-1);
  border-radius: 6px;
  padding: 4px 8px;
}

.btn {
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.btn:hover { background: var(--bg-3); }
.btn-primary {
  background: var(--accent);
  color: #ffffff;
  border-color: var(--accent);
}
.btn-primary:hover { opacity: 0.92; background: var(--accent); }
.btn-active {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}
.btn-sm { padding: 2px 6px; font-size: 11px; }

.update-banner {
  background: rgba(255, 212, 39, 0.14);
  border: 1px solid rgba(255, 212, 39, 0.45);
  border-radius: 8px;
  padding: 8px 10px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
}

.rows-container {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.row-cards {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}

@media (min-width: 640px) {
  .row-cards {
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  }
}

.metric-card {
  background: var(--bg-2);
  border: 1px solid var(--bd-2);
  border-radius: 8px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.metric-card-label {
  font-size: 11px;
  color: var(--fg-2);
}

.metric-card-val {
  font-size: 13px;
  font-weight: 600;
  word-break: break-word;
  white-space: pre-line;
}

.progress-track {
  width: 100%;
  height: 6px;
  border-radius: 999px;
  background: var(--bg-3);
  overflow: hidden;
  margin-top: 2px;
}

.progress-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.25s ease;
}

.strip-row {
  background: var(--bg-2);
  border: 1px solid var(--bd-2);
  border-radius: 6px;
  padding: 6px 10px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}

.strip-sep { color: var(--fg-3); }

/* 就地分列拖曳編輯樣式 */
.edit-row-box {
  background: var(--bg-2);
  border: 1px dashed var(--bd-1);
  border-radius: 8px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.edit-row-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--fg-2);
}

.edit-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  min-height: 32px;
  align-items: center;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--bg-1);
  border: 1px solid var(--bd-1);
  border-radius: 6px;
  padding: 4px 7px;
  font-size: 12px;
  user-select: none;
  touch-action: none;
}

.chip-handle {
  cursor: grab;
  color: var(--fg-3);
  font-weight: 700;
}

.chip-dragging {
  opacity: 0.4;
}

.chip.drop-active {
  border-left: 3px solid var(--accent);
  box-shadow: -3px 0 0 var(--accent);
}

.edit-row-box.drop-active {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.chip-val-preview {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
  color: var(--fg-2);
  max-width: 110px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.drawer-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--bg-1);
  border: 1px solid var(--bd-1);
  border-radius: 6px;
  padding: 2px 4px;
}

.drawer-item > .btn {
  flex: 1;
  border: none;
  background: transparent;
  justify-content: flex-start;
  text-align: left;
}

.drawer-item.is-active {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.stacked-bar {
  display: flex;
  width: 100%;
  height: 10px;
  border-radius: 999px;
  overflow: hidden;
  background: var(--bg-3);
  margin: 8px 0 6px;
}

.stacked-seg {
  height: 100%;
  min-width: 2px;
}

.breakdown-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 6px;
}

.usage-summary-row {
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px dashed var(--bd-1);
  font-size: 11px;
  color: var(--fg-2);
}

.copy-fallback-bar {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 12px;
  z-index: 120;
  background: var(--bg-1);
  border: 1.5px solid var(--accent);
  border-radius: 8px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
}

.drop-slot-between {
  height: 14px;
  border-radius: 6px;
  border: 1px dashed transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: transparent;
  transition: all 0.15s ease;
}

.drop-slot-between.drop-active {
  height: 28px;
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
}

.drop-new-row {
  border: 1.5px dashed var(--bd-1);
  border-radius: 8px;
  padding: 10px;
  text-align: center;
  font-size: 12px;
  color: var(--fg-2);
}

.drop-new-row.drop-active {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
}

.drag-ghost {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  background: var(--bg-1);
  border: 1.5px solid var(--accent);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 12px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
}

.drawer-box {
  background: var(--bg-2);
  border: 1px solid var(--bd-1);
  border-radius: 8px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.cat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
  gap: 6px;
}

.sticky-save-bar {
  position: sticky;
  bottom: 0;
  z-index: 20;
  background: var(--bg-1);
  border-top: 1px solid var(--bd-1);
  padding: 8px 0 2px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.breakdown-card {
  background: var(--bg-2);
  border: 1px solid var(--bd-2);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 12px;
}

.toast {
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 100;
  background: var(--fg-1);
  color: var(--bg-1);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
}

  </style>
</head>
